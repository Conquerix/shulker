name: Publish repository Wiki

on:
  push:
    paths:
      - ".github/workflows/wiki.yml"
      - "docs/wiki/**"
      - "flake.lock"
      - "flake.nix"
      - "lib/**"
      - "scripts/**"
      - "system/**"
      - "topology/**"
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

concurrency:
  group: publish-server-wiki
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Validate Wiki publication contracts
        run: nix build --no-link .#checks.x86_64-linux.wiki-publication-contract-suite
      - name: Refresh sanitized Pangolin topology
        env:
          PANGOLIN_API_ENDPOINT: ${{ vars.PANGOLIN_API_ENDPOINT }}
          PANGOLIN_API_KEY: ${{ secrets.PANGOLIN_TOPOLOGY_API_KEY }}
          PANGOLIN_ORG_ID: ${{ vars.PANGOLIN_ORG_ID }}
        shell: bash
        run: |
          if [ -z "$PANGOLIN_API_ENDPOINT" ] || [ -z "$PANGOLIN_API_KEY" ] || [ -z "$PANGOLIN_ORG_ID" ]; then
            echo "Pangolin topology credentials are not configured; using the committed sanitized snapshot."
            exit 0
          fi
          bash scripts/fetch-pangolin-topology.sh
      - name: Build Wiki documentation
        run: |
          nix build .#host-docs --out-link host-docs-result
          nix build .#wiki-docs --out-link wiki-docs-result
      - name: Clone Wiki
        env:
          WIKI_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          basic_auth="$(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 --wrap=0)"
          git -c http.extraheader="AUTHORIZATION: basic $basic_auth" \
            clone "https://github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
      - name: Synchronize generated pages
        run: bash scripts/sync-server-wiki.sh host-docs-result wiki wiki-docs-result
      - name: Publish changed pages
        env:
          WIKI_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git -C wiki add --all
          if git -C wiki diff --cached --quiet; then
            echo "Wiki pages are already current."
            exit 0
          fi

          git -C wiki config user.name "github-actions[bot]"
          git -C wiki config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C wiki commit -m "docs: publish repository Wiki"

          basic_auth="$(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 --wrap=0)"
          git -c http.extraheader="AUTHORIZATION: basic $basic_auth" -C wiki push origin HEAD
