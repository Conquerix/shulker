name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Evaluate every flake output
        run: nix flake check --no-build --all-systems
      - name: Run repository checks
        run: nix build --no-link .#checks.x86_64-linux.pre-commit-check
      - name: Run Seafile contract suite
        run: nix build --no-link .#checks.x86_64-linux.seafile-contract-suite
      - name: Build generated Wiki documentation
        run: |
          nix build .#host-docs --out-link host-docs-result
          nix build .#wiki-docs --out-link wiki-docs-result
          mkdir generated-wiki-docs
          cp -L host-docs-result/*.md generated-wiki-docs/
          cp -L wiki-docs-result/*.md generated-wiki-docs/
          cp -L wiki-docs-result/infrastructure.json generated-wiki-docs/
          cp -L wiki-docs-result/wiki-pages.txt generated-wiki-docs/
      - name: Upload generated Wiki documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wiki-docs-${{ github.sha }}
          path: generated-wiki-docs
          if-no-files-found: error
          retention-days: 14
